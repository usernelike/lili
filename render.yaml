services:
  - type: web
    name: lili-hub
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd packages/backend && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./data/app.db
