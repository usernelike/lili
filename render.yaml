services:
  - type: web
    name: lili-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MYSQL_URL
        value: jdbc:mysql://localhost:3306/lili_hub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        value: ""
