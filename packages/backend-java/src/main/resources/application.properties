server.port=${PORT:8080}

# MySQL (TiDB Serverless compatible)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/lili_hub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Initialize schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Kimi AI
kimi.api.key=${KIMI_API_KEY:}
kimi.api.url=${KIMI_API_URL:https://api.moonshot.cn/v1/chat/completions}
kimi.model=${KIMI_MODEL:moonshot-v1-8k}

# Spring Boot 3 path matching (for SPA fallback)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
